spring:
  application:
    name: back_end

  # Nạp .env khi chạy từ IDE hoặc CLI. Hỗ trợ cả khi working dir là thư mục gốc repo hoặc back_end/:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway giữ schema, Hibernate chỉ kiểm tra entity khớp bảng

  flyway:
    enabled: true
    locations: classpath:db/migration

# Sau nginx: đặt FORWARD_HEADERS_STRATEGY=native để IP người dùng (X-Forwarded-For, chỉ tin proxy nội bộ) dùng cho
# giới hạn đăng nhập sai; mặc định none (chạy trực tiếp, không tin header do client tự gửi).
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized   # W1-1: chỉ người đã đăng nhập thấy chi tiết (DB, ổ đĩa)

app:
  llm:
    api-key: ${LLM_API_KEY:}   # để trống mặc định để smoke test không văng lỗi thiếu biến
    model: ${LLM_MODEL:gemini-3.5-flash-lite}
    solver-model: ${LLM_SOLVER_MODEL:gemini-3.5-flash-lite}
    # Chỉ đặt khi kiểm chứng bằng Gemini giả (W1-5); để trống thì gọi https://generativelanguage.googleapis.com/v1beta/models/
    base-url: ${LLM_BASE_URL:}
  embedding:
    model: ${EMBEDDING_MODEL:}
  # Công cụ thí nghiệm (quyết định 25/10): /api/generation/* và /api/catalog/templates chỉ tồn tại khi bật. Mặc định tắt;
  # không bật ở prod (admin gọi các đường này sẽ gọi Gemini tính phí).
  experiment:
    enabled: ${EXPERIMENT_ENABLED:false}
  worker:
    enabled: ${WORKER_ENABLED:false}
    poll-delay-ms: ${WORKER_POLL_DELAY_MS:15000}
    max-attempts: ${WORKER_MAX_ATTEMPTS:3}
    # Job running quá ngưỡng này (giây) được trả về pending khi khởi động và mỗi stale-check-ms (chỉ khi worker bật).
    stale-after-seconds: ${WORKER_STALE_AFTER_SECONDS:300}
    stale-check-ms: ${WORKER_STALE_CHECK_MS:120000}
  # W1-1: đăng nhập JWT. JWT_SECRET bắt buộc (base64, từ 32 byte, ví dụ `openssl rand -base64 48`); thiếu thì không
  # khởi động. Admin đầu tiên tạo từ ADMIN_EMAIL/ADMIN_PASSWORD khi chưa có admin (không ghi đè). Mặc định ở SecurityProperties.
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh:
      ttl: ${REFRESH_TTL:7d}
      absolute-ttl: ${REFRESH_ABSOLUTE_TTL:30d}
    cookie-secure: ${COOKIE_SECURE:true}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      name: ${ADMIN_NAME:Quản trị viên}
    # Giới hạn đăng nhập sai theo email + IP (trong bộ nhớ): sai max-failures lần trong window thì khóa lock.
    login-rate-limit:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:15m}
      lock: ${LOGIN_LOCK_DURATION:15m}
  # Xuất đề ra Word (GET /api/exams/{id}/export/docx) cần pandoc; mặc định tìm "pandoc" trên PATH.
  export:
    pandoc-path: ${PANDOC_PATH:pandoc}
  # Bảng điểm cho phần tạo đề sau này (V4); luồng sinh câu không dùng. Giá trị mặc định nằm ở ExamScoringProperties.
  exam:
    scoring:
      mcq-per-question: 0.25                      # 12 câu MCQ = 3 điểm
      sa-per-question: 0.5
      tf-by-correct-count: [0, 0.1, 0.25, 0.5, 1.0] # chỉ số = số ý đúng (0..4) của một câu Đúng/Sai
