spring:
  application:
    name: back_end

  # Nạp .env khi chạy từ IDE hoặc CLI. Hỗ trợ cả khi working dir là thư mục gốc repo hoặc back_end/:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway giữ schema, Hibernate chỉ kiểm tra entity khớp bảng

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always   # chỉ dùng khi dev

app:
  llm:
    api-key: ${LLM_API_KEY:}   # để trống mặc định để smoke test không văng lỗi thiếu biến
    model: ${LLM_MODEL:gemini-3.5-flash-lite}
    solver-model: ${LLM_SOLVER_MODEL:gemini-3.5-flash-lite}
  embedding:
    model: ${EMBEDDING_MODEL:}
  worker:
    enabled: ${WORKER_ENABLED:false}
    poll-delay-ms: ${WORKER_POLL_DELAY_MS:15000}
    max-attempts: ${WORKER_MAX_ATTEMPTS:3}
