# Profile prod (W1-5): bật bằng SPRING_PROFILES_ACTIVE=prod (compose.prod.yaml đặt sẵn). Chỉ chứa phần KHÁC application.yaml;
# bí mật và địa chỉ đi qua biến môi trường như thường lệ.
spring:
  # Chuẩn bị cho tài liệu đính kèm (chưa có endpoint upload). Caddy cũng giới hạn thân request /api ở 12MB.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # Dừng nhẹ nhàng khi docker stop: chờ request đang xử lý (stop_grace_period của compose là 40 giây)
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

# Swagger UI và OpenAPI đang permitAll trong SecurityConfig, nên tắt hẳn ở môi trường thật (Caddy cũng chặn các đường này)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Giới hạn bộ nhớ và đồng thời cho môi trường thật VPS 2GB / container app 1GB (W2-4a Mục 1)
app:
  # Chờ worker xong job đang gọi Gemini khi tắt ứng dụng (F-09): nhỏ hơn timeout-per-shutdown-phase (30s) và
  # stop_grace_period của compose (40s). Job không kịp xong thì được trả về pending (không tính lỗi).
  worker:
    shutdown-await-ms: 28000
  # Mặc định giữ nguyên giá trị cũ; đổi bằng biến môi trường (F-11) mà không phải sửa file.
  materials:
    max-concurrent-extractions: ${MATERIAL_MAX_CONCURRENT:1}
    pandoc-heap-mb: ${MATERIAL_PANDOC_HEAP_MB:256}
    queue-wait: ${MATERIAL_QUEUE_WAIT:30s}
