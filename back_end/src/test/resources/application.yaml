spring:
  application:
    name: back_end_test

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    # Ràng buộc cố định vào datn_mcq_test; tuyệt đối KHÔNG dùng ${DB_NAME}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/datn_mcq_test
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema trên datn_mcq_test, Hibernate chỉ validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  llm:
    api-key: ""           # Khóa rỗng ở mức property
    model: gemini-3.5-flash-lite
    solver-model: gemini-3.5-flash-lite
  embedding:
    model: ""
  worker:
    enabled: false        # Tắt poller worker khi chạy test
